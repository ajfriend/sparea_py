name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          # matches minimum_zig_version in src/zig/build.zig.zon
          version: "0.15.2"

      - uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python-version }}

      - uses: extractions/setup-just@v4

      # `uv sync` triggers the hatchling build hook (src/hatch_build.py),
      # which shells out to `zig build` and stages libsparea.* under
      # src/sparea/. The non-editable wheel install puts it next to
      # __init__.py where the ctypes loader expects it.
      - name: Install
        run: uv sync

      # ci-test runs `uv run pytest -q`. pytest config (in pyproject.toml)
      # turns on --cov-branch + --cov-fail-under=100, so a coverage
      # regression fails this step.
      - name: Test + coverage
        run: just ci-test
