name: wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: wheels-${{ github.ref }}
  # Don't cancel a release run mid-publish, but for branch pushes and
  # PRs the latest commit should win — old runs just block the queue.
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          cache-suffix: wheels-sdist

      - name: Build sdist
        run: uv build --sdist

      - name: Test sdist round-trip
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python --no-cache dist/*.tar.gz pytest numpy
          test-env/bin/pytest -o addopts=

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          compression-level: 0

  wheels:
    # One job per build identifier — splits the wheel matrix at the
    # finest granularity so build wall-clock approaches max(per-wheel
    # build time) instead of sum. Free for public repos on GitHub
    # Actions runner-minutes; meaningfully faster on release where
    # the bottleneck before was Windows building 5 wheels serially.
    name: ${{ matrix.only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (manylinux + musllinux)
          - { os: ubuntu-latest,    archs: x86_64,  only: cp311-manylinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp312-manylinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp313-manylinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp314-manylinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp314t-manylinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp311-musllinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp312-musllinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp313-musllinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp314-musllinux_x86_64 }
          - { os: ubuntu-latest,    archs: x86_64,  only: cp314t-musllinux_x86_64 }
          # Linux aarch64
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp311-manylinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp312-manylinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp313-manylinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp314-manylinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp314t-manylinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp311-musllinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp312-musllinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp313-musllinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp314-musllinux_aarch64 }
          - { os: ubuntu-24.04-arm, archs: aarch64, only: cp314t-musllinux_aarch64 }
          # macOS arm64
          - { os: macos-latest,     archs: arm64,   only: cp311-macosx_arm64 }
          - { os: macos-latest,     archs: arm64,   only: cp312-macosx_arm64 }
          - { os: macos-latest,     archs: arm64,   only: cp313-macosx_arm64 }
          - { os: macos-latest,     archs: arm64,   only: cp314-macosx_arm64 }
          - { os: macos-latest,     archs: arm64,   only: cp314t-macosx_arm64 }
          # Windows AMD64
          - { os: windows-latest,   archs: AMD64,   only: cp311-win_amd64 }
          - { os: windows-latest,   archs: AMD64,   only: cp312-win_amd64 }
          - { os: windows-latest,   archs: AMD64,   only: cp313-win_amd64 }
          - { os: windows-latest,   archs: AMD64,   only: cp314-win_amd64 }
          - { os: windows-latest,   archs: AMD64,   only: cp314t-win_amd64 }

    steps:
      - uses: actions/checkout@v6

      # cibuildwheel uses uv as the build frontend; on Linux it
      # bootstraps uv inside the manylinux container, but on macOS /
      # Windows it expects uv on the host PATH.
      - uses: astral-sh/setup-uv@v8.1.0

      # Pin uv's cache to C: on Windows so hardlinks work.
      #
      # setup-uv defaults UV_CACHE_DIR to ${RUNNER_TEMP}/setup-uv-cache,
      # which on GitHub-hosted Windows runners is D:\a\_temp\... .
      # cibuildwheel's `build[uv]` frontend creates Python's isolated
      # build env via tempfile.gettempdir(), which on Windows resolves
      # to C:\Users\runneradmin\AppData\Local\Temp\... . NTFS doesn't
      # support hardlinks across drives, so uv falls back to full file
      # copy ("Failed to hard link ... os error 17; falling back to
      # copy"). For build-isolation envs containing a chunky toolchain
      # like ziglang (~50MB, hundreds of small files, PE binaries that
      # Defender deep-scans), that's ~48s per wheel install vs ~8s
      # when hardlinking works.
      #
      # Pinning UV_CACHE_DIR to %LOCALAPPDATA% (always on C:) puts the
      # cache on the same drive as the build env and restores
      # hardlinking. Measured impact in this repo: Windows wheels lane
      # 580s → 291s (~50%).
      #
      # Tracking upstream (acknowledged but not fixed; eifinger himself
      # tried in setup-uv#451 and reverted in #460):
      #   https://github.com/astral-sh/setup-uv/issues/227
      #   https://github.com/astral-sh/setup-uv/issues/371
      #   https://github.com/astral-sh/setup-uv/pull/451
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:LOCALAPPDATA 'uv-cache'
          "UV_CACHE_DIR=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: pypa/cibuildwheel@v3.4.1
        with:
          only: ${{ matrix.only }}

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.only }}
          path: wheelhouse/*.whl
          compression-level: 0

  to-pypi:
    name: publish to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sparea
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
