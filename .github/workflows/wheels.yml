name: wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: wheels-${{ github.ref }}
  # Don't cancel a release run mid-publish, but for branch pushes and
  # PRs the latest commit should win — old runs just block the queue.
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"

      - name: Build sdist
        run: uv build --sdist

      - name: Test sdist round-trip
        run: |
          uv venv test-env
          uv pip install --python test-env/bin/python --no-cache dist/*.tar.gz pytest numpy
          test-env/bin/pytest -o addopts=

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          compression-level: 0

  wheels:
    name: ${{ matrix.os }} (${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-latest     # Apple Silicon
            archs: arm64
          - os: windows-latest
            archs: AMD64

    steps:
      - uses: actions/checkout@v6

      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl
          compression-level: 0

  to-pypi:
    name: publish to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sparea
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
