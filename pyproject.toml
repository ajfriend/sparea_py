[build-system]
# ziglang gives the build env a Zig toolchain — no host install needed.
requires = ["hatchling", "ziglang>=0.15.2"]
build-backend = "hatchling.build"

[project]
name = "sparea"
version = "0.1.0"
description = "Spherical polygon area on the unit sphere"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
addopts = [
    "--cov=sparea",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

# Non-editable installs put sparea/ under site-packages; alias it back
# to src/sparea/ so the coverage report shows the source path.
[tool.coverage.paths]
sparea = ["src/sparea", "*/site-packages/sparea"]

# libsparea.* is .gitignore'd; force-include it in wheel/sdist.
[tool.hatch.build]
artifacts = ["src/sparea/libsparea.*"]

# Scope to wheel target — sdists are source-only.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sparea"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "justfile",
    "readme.md",
]

[tool.cibuildwheel]
skip = "pp*"
test-requires = ["pytest", "numpy"]
# `--no-cov` because the coverage gate runs once in test.yml; running
# it inside every cibuildwheel test env would just repeat the work
# (and `pytest-cov` isn't even in test-requires here).
test-command = "pytest {project}/tests --no-cov"
