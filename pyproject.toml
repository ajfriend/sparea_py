[build-system]
# meson-python drives meson, which compiles the Cython extension and
# links it against the Zig static archive.
requires = ["meson-python>=0.16", "ziglang>=0.15.2", "cython>=3.0"]
build-backend = "mesonpy"

[project]
name = "sparea"
version = "0.4.0"
description = "Compute the area of spherical polygons on the unit sphere."
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["license"]
authors = [{ name = "AJ Friend", email = "ajfriend@gmail.com" }]
keywords = ["spherical", "polygon", "area", "geometry", "geodesy", "geospatial", "zig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Zig",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ajfriend/sparea_py"
Repository = "https://github.com/ajfriend/sparea_py"
Issues = "https://github.com/ajfriend/sparea_py/issues"
"Upstream Zig package" = "https://github.com/ajfriend/sparea_zig"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]
lab = ["jupyterlab>=4", "matplotlib>=3", "h3"]

[tool.pytest.ini_options]
addopts = [
    "--cov=sparea",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

# Non-editable installs put sparea/ under site-packages; alias it back
# to src/sparea/ so the coverage report shows the source path.
[tool.coverage.paths]
sparea = ["src/sparea", "*/site-packages/sparea"]


[tool.cibuildwheel]
# uv installs the build deps (meson-python, ziglang, cython, numpy)
# faster than pip — saves ~20-30s per wheel build env, ~10 min total
# across the matrix.
build-frontend = "build[uv]"
test-requires = ["pytest", "numpy"]
# Override pyproject.toml's addopts (which assume pytest-cov) — the
# coverage gate runs once in test.yml; repeating it 35× across every
# cibuildwheel test env would just be wasted work.
test-command = "pytest {project}/tests -o addopts="
