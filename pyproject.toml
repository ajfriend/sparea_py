[build-system]
# scikit-build-core drives CMake, which builds both the nanobind
# extension and (via a custom command) the Zig dylib.
requires = ["scikit-build-core>=0.10", "ziglang>=0.15.2", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "sparea"
version = "0.1.1"
description = "Compute the area of spherical polygons on the unit sphere."
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["license"]
authors = [{ name = "AJ Friend", email = "ajfriend@gmail.com" }]
keywords = ["spherical", "polygon", "area", "geometry", "geodesy", "geospatial", "zig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Zig",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ajfriend/sparea_py"
Repository = "https://github.com/ajfriend/sparea_py"
Issues = "https://github.com/ajfriend/sparea_py/issues"
"Upstream Zig package" = "https://github.com/ajfriend/sparea_zig"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
addopts = [
    "--cov=sparea",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

[tool.coverage.paths]
sparea = ["src/sparea", "*/site-packages/sparea"]

[tool.scikit-build]
# Project layout: pure-Python sources live under src/sparea/; CMake
# stages compiled artifacts (the nanobind extension + libsparea)
# alongside them via `install(... DESTINATION sparea)`.
wheel.packages = ["src/sparea"]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"

[tool.cibuildwheel]
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests -o addopts="
