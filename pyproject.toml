[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparea"
version = "0.1.0"
description = "Spherical polygon area on the unit sphere"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["sparea"]
include-package-data = true

[tool.setuptools.package-data]
sparea = ["libsparea.*"]

[dependency-groups]
dev = ["pytest>=8"]
