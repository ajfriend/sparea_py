[build-system]
# `ziglang` ships the Zig compiler as a Python wheel (puts `zig` on
# the build-env PATH). Listing it here means `pip install .`,
# `uv build`, and cibuildwheel all get a working Zig toolchain in
# their isolated build env without any host-level setup.
requires = ["hatchling", "ziglang>=0.15.2"]
build-backend = "hatchling.build"

[project]
name = "sparea"
version = "0.1.0"
description = "Spherical polygon area on the unit sphere"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
addopts = [
    "--cov=sparea",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

# Non-editable installs put sparea/ under site-packages; alias it back
# to src/sparea/ so the coverage report shows the source path.
[tool.coverage.paths]
sparea = ["src/sparea", "*/site-packages/sparea"]

# The `custom` build hook (hatch_build.py) runs `zig build` and stages
# libsparea.* into src/sparea/ at wheel-build time. It's .gitignore'd,
# so it's also listed under `artifacts` to force-include in wheel + sdist.
[tool.hatch.build]
artifacts = ["src/sparea/libsparea.*"]

# Scope the zig-build hook to the wheel target only. Sdists are
# source-only — running zig there is wasteful and would force the
# sdist build env to have ziglang available.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sparea"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "justfile",
    "readme.md",
]

[tool.cibuildwheel]
# We require Python 3.11+ via project.requires-python; cibuildwheel
# auto-skips older CPythons, so just exclude PyPy here.
skip = "pp*"
test-requires = ["pytest", "pytest-cov", "numpy"]
test-command = "pytest {project}/tests"
