[build-system]
# ziglang gives the build env a Zig toolchain — no host install needed.
requires = ["hatchling", "ziglang>=0.15.2"]
build-backend = "hatchling.build"

[project]
name = "sparea"
version = "0.1.0"
description = "Compute the area of spherical polygons on the unit sphere."
readme = "readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["license"]
authors = [{ name = "AJ Friend", email = "ajfriend@gmail.com" }]
keywords = ["spherical", "polygon", "area", "geometry", "geodesy", "geospatial", "zig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ajfriend/sparea_py"
Repository = "https://github.com/ajfriend/sparea_py"
Issues = "https://github.com/ajfriend/sparea_py/issues"
"Upstream Zig package" = "https://github.com/ajfriend/sparea_zig"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
addopts = [
    "--cov=sparea",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true

# Non-editable installs put sparea/ under site-packages; alias it back
# to src/sparea/ so the coverage report shows the source path.
[tool.coverage.paths]
sparea = ["src/sparea", "*/site-packages/sparea"]

# libsparea.* is .gitignore'd; force-include it in wheel/sdist.
[tool.hatch.build]
artifacts = ["src/sparea/libsparea.*"]

# Scope to wheel target — sdists are source-only.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sparea"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "readme.md"]

[tool.cibuildwheel]
skip = "pp*"
test-requires = ["pytest", "numpy"]
# Override pyproject.toml's addopts (which assume pytest-cov) — the
# coverage gate runs once in test.yml; repeating it 35× across every
# cibuildwheel test env would just be wasted work.
test-command = "pytest {project}/tests -o addopts="
