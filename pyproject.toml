[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparea"
version = "0.1.0"
description = "Spherical polygon area on the unit sphere"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8"]

# The `custom` build hook (hatch_build.py) runs `zig build` and stages
# libsparea.* into src/sparea/ at wheel-build time. It's .gitignore'd,
# so it's also listed under `artifacts` to force-include in wheel + sdist.
[tool.hatch.build]
artifacts = ["src/sparea/libsparea.*"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sparea"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "justfile",
    "hatch_build.py",
    "README.md",
]
